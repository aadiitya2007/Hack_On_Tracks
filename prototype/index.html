<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultIQ - Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="app-shell">
    <nav id="sidebar">
      <div class="brand">
        <div class="brand-dot"></div>
        VaultIQ
      </div>
      
      <a href="#/dashboard" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        Dashboard
      </a>
      <a href="#/accounts" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>

      </a>
      <a href="#/risk" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        Risk Profile
      </a>
    </nav>
    
    <div id="main-area">
      <header id="topbar">
        <div></div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <button class="btn-ghost" onclick="alert('Tour coming soon')">Start Tour</button>
          <button id="theme-toggle" class="btn-ghost" style="padding: 8px;" aria-label="Toggle Theme"></button>
        </div>
      </header>
      
      <main id="app-content">
        <!-- Injected via app.js -->
      </main>
      
      <footer id="footer-banner">
        Prototype with sample data. Not live market data. Educational, not investment advice.
      </footer>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
