services:
  - type: web
    name: vaultiq-dashboard
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      # By default we use SQLite for the hackathon demo, so we don't strictly need a DATABASE_URL for Postgres,
      # but if you switch to Postgres, Render will inject it here if linked.
      - key: DATABASE_URL
        value: file:./dev.db
