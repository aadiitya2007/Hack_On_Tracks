services:
  - type: web
    name: indian-investment-dashboard
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: investment-db
          property: connectionString
      - key: NODE_VERSION
        value: 20.x

  - type: psql
    name: investment-db
    plan: free
    postgresMajorVersion: 15
