services:
  - type: web
    name: vaultiq-web
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx tsx scripts/seed-prod.ts && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: NEXT_PUBLIC_ML_URL
        value: "https://vaultiq-ml.onrender.com"
      - key: ML_SERVICE_URL
        value: "https://vaultiq-ml.onrender.com"
        
  - type: web
    name: vaultiq-ml
    env: python
    plan: free
    buildCommand: pip install -r ml-service/requirements.txt
    startCommand: uvicorn ml-service.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
